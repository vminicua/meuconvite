{% extends "base.html" %}

{% block title %}Editar presente · {{ wedding.display_names }}{% endblock %}

{% block content %}
{% include "partials/wedding_nav.html" %}
<div class="mx-auto" style="max-width:720px">
    <div class="workspace-section-heading mb-3">
        <span class="workspace-eyebrow">LISTA DE PRESENTES</span>
        <h2 class="h4 mb-1">Editar {{ gift.name }}</h2>
    </div>
    <div class="card border-0 shadow-sm"><div class="card-body p-4 p-lg-5">
        <form method="post" novalidate>{% csrf_token %}{% include "partials/form_fields.html" %}
            <div class="d-flex gap-2 mt-4"><button class="btn btn-primary">Guardar alterações</button><a class="btn btn-outline-secondary" href="{% url 'guests:gifts' wedding.pk %}">Cancelar</a></div>
        </form>
    </div></div>
</div>
{% endblock %}
