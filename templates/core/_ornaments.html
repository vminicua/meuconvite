{% comment %}
Ornamentos vetoriais da página inicial.

Desenhados à mão em SVG (não são imagens externas): pesam poucos KB,
ficam nítidos em qualquer ecrã, aceitam as cores do template e não
dependem de nenhum CDN — importante em ligações móveis lentas.
{% endcomment %}
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
        <symbol id="mc-leaf" viewBox="0 0 40 90">
            <path d="M20 2C31 22 34 48 20 88 6 48 9 22 20 2Z" fill="currentColor" opacity=".55"/>
            <path d="M20 6v78" stroke="#fff" stroke-width="1.2" opacity=".45"/>
        </symbol>

        <symbol id="mc-rose" viewBox="0 0 60 60">
            <circle cx="30" cy="30" r="28" fill="currentColor" opacity=".35"/>
            <circle cx="30" cy="30" r="20" fill="currentColor" opacity=".45"/>
            <path d="M30 12a18 18 0 1 1-17.4 22.6A13 13 0 1 0 30 18a8 8 0 1 0 6.5 12.6"
                  fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
        </symbol>

        <symbol id="mc-bouquet" viewBox="0 0 220 220">
            <g class="ornament__sway">
                <g transform="translate(96 8) rotate(18)"><use href="#mc-leaf" width="34" height="76" class="o-green"/></g>
                <g transform="translate(140 26) rotate(52)"><use href="#mc-leaf" width="28" height="64" class="o-green-2"/></g>
                <g transform="translate(56 34) rotate(-28)"><use href="#mc-leaf" width="30" height="70" class="o-green-2"/></g>
                <g transform="translate(150 78) rotate(88)"><use href="#mc-leaf" width="24" height="56" class="o-gold"/></g>
            </g>
            <g transform="translate(78 62)"><use href="#mc-rose" width="66" height="66" class="o-rose"/></g>
            <g transform="translate(132 96)"><use href="#mc-rose" width="46" height="46" class="o-rose-2"/></g>
            <g transform="translate(52 112)"><use href="#mc-rose" width="38" height="38" class="o-blush"/></g>
            <g transform="translate(112 146)"><use href="#mc-rose" width="28" height="28" class="o-gold"/></g>
            <circle cx="60" cy="86" r="4" class="o-gold-fill"/>
            <circle cx="160" cy="70" r="3.4" class="o-gold-fill"/>
            <circle cx="96" cy="168" r="3" class="o-gold-fill"/>
            <circle cx="146" cy="140" r="2.6" class="o-gold-fill"/>
        </symbol>

        <symbol id="mc-divider" viewBox="0 0 160 20">
            <path d="M4 10h50M106 10h50" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
            <path d="M80 4c-5-4-12 0-9 5 2 4 9 7 9 7s7-3 9-7c3-5-4-9-9-5Z"
                  fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            <circle cx="62" cy="10" r="1.6" fill="currentColor"/>
            <circle cx="98" cy="10" r="1.6" fill="currentColor"/>
        </symbol>

        <symbol id="mc-hearts" viewBox="0 0 80 60">
            <path d="M40 52S18 38 12 24C7 13 18 4 27 9c6 3 9 9 13 14 4-5 7-11 13-14 9-5 20 4 15 15-6 14-28 28-28 28Z"
                  fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>
            <path d="M53 20c4-6 12-3 11 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".6"/>
        </symbol>
    </defs>
</svg>
