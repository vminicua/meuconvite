{% if messages %}
    <div class="messages mb-3">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show js-flash-message"
                 role="alert" data-swal-kind="{{ message.tags|default:'info' }}" data-swal-message="{{ message|escape }}">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
            </div>
        {% endfor %}
    </div>
{% endif %}
