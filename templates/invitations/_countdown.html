{% load invitation_texts %}{% if wedding.show_countdown and wedding.main_date %}
    <div class="inv-countdown" data-countdown="{{ countdown_target|date:'c' }}" role="timer">
        <div class="inv-countdown__cell"><span data-unit="days">—</span><small>{% invtext "countdown_days" %}</small></div>
        <div class="inv-countdown__cell"><span data-unit="hours">—</span><small>{% invtext "countdown_hours" %}</small></div>
        <div class="inv-countdown__cell"><span data-unit="minutes">—</span><small>{% invtext "countdown_minutes" %}</small></div>
        <div class="inv-countdown__cell"><span data-unit="seconds">—</span><small>{% invtext "countdown_seconds" %}</small></div>
    </div>
{% endif %}
