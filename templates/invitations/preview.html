{% load static %}<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>{{ wedding.display_names }} · Convite</title>

    <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
    {% if template.fonts_url %}
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="{{ template.fonts_url }}" rel="stylesheet">
    {% endif %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{% static 'css/invitation.css' %}" rel="stylesheet">
</head>
<body class="inv inv--{{ template.layout }}" style="{{ css_variables }}">

{% if is_preview %}
    <div class="inv-preview-bar">
        <span><i class="bi bi-eye me-1"></i>Pré-visualização — {{ template.name }}</span>
        <span class="inv-preview-bar__actions">
            <a href="{% url 'weddings:design' wedding.pk %}">Voltar ao aspecto</a>
        </span>
    </div>
{% endif %}

{% include template.layout_template %}

<script src="{% static 'js/invitation.js' %}"></script>
</body>
</html>
